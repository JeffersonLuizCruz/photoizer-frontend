<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e162a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Photoizer" />
    <title>Photoizer CRM</title>
    <script>
      // Aplica o tema antes do primeiro paint para evitar flash (FOUC) e alinhar a cor do chrome do navegador.
      (function () {
        try {
          var stored = localStorage.getItem('theme-storage');
          var theme = stored ? JSON.parse(stored).state.theme : null;
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var dark = theme === 'dark';
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0a0a0a' : '#0e162a');
          var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (statusBar) statusBar.setAttribute('content', dark ? 'black-translucent' : 'default');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
